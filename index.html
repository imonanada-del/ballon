<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>المنطاد الطائر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

        :root {
            --primary-blue: #005f73;
            --sky-blue: #D6E4F0;
            --gold: #C9A227;
            --dark-gold: #a3821c;
            --accent-green: #2B9348;
            --accent-red: #D90429;
            --text-dark: #1D2D44;
            --white-card: rgba(255, 255, 255, 0.98);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            color: var(--text-dark);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Fixed Top Header - High Z-Index to prevent overlapping */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 75px;
            z-index: 2000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-bottom: 4px solid var(--gold);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        header.compact {
            height: 60px;
            padding: 5px 15px;
        }

        .game-title-header {
            font-weight: 900;
            font-size: 1.4rem;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .student-badge {
            background: var(--sky-blue);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 800;
            color: var(--primary-blue);
            border: 2px solid var(--gold);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
        }

        /* Safe area reserved below header with strict top margin */
        #game-area {
            position: absolute;
            top: 75px;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1;
            overflow: hidden;
        }

        .bg-cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50px;
            animation: moveBgCloud linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes moveBgCloud {
            from { transform: translateX(100vw); }
            to { transform: translateX(-200px); }
        }

        #start-screen {
            position: absolute;
            inset: 0;
            z-index: 3000;
            background: linear-gradient(135deg, #a8dede 0%, #f3f8fb 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .start-card {
            background: var(--white-card);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 4px solid var(--gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .main-title {
            font-size: 2.3rem;
            font-weight: 900;
            color: var(--primary-blue);
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .welcome-msg {
            font-size: 1.05rem;
            font-weight: 700;
            color: #555;
            line-height: 1.5;
        }

        .input-group {
            width: 100%;
        }

        .name-input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #ccc;
            font-size: 1.2rem;
            font-weight: 800;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .name-input:focus {
            border-color: var(--gold);
        }

        .btn-start {
            background: linear-gradient(to bottom, #C9A227, #a3821c);
            color: white;
            font-size: 1.4rem;
            font-weight: 900;
            padding: 12px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #785e10, 0 10px 15px rgba(0,0,0,0.2);
            transition: all 0.2s;
            width: 100%;
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #785e10, 0 5px 10px rgba(0,0,0,0.2);
        }

        /* Hot Air Balloon - Placed BEHIND clouds so clouds are fully clickable and visible on top */
        #balloon {
            position: absolute;
            width: 90px;
            height: 125px;
            z-index: 5;
            transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.2));
            pointer-events: none;
        }

        /* Interactive Clouds - Placed ABOVE balloon (z-index 15) so they are never covered by balloon */
        .interactive-cloud {
            position: absolute;
            cursor: pointer;
            transition: transform 0.3s, filter 0.3s;
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .interactive-cloud:hover {
            transform: scale(1.08);
        }

        .cloud-svg {
            width: 90px;
            height: 55px;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.15));
        }

        .cloud-number {
            position: absolute;
            font-weight: 900;
            font-size: 1.15rem;
            color: var(--primary-blue);
            z-index: 16;
        }

        .interactive-cloud.completed .cloud-svg path {
            fill: #C9A227 !important;
        }

        .interactive-cloud.completed .cloud-number {
            color: #ffffff;
        }

        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 2500;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .question-card {
            background: var(--white-card);
            border-radius: 20px;
            padding: 25px;
            max-width: 600px;
            width: 100%;
            border: 4px solid var(--gold);
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .question-card {
            transform: translateY(0);
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary-blue);
            line-height: 1.5;
            background: var(--sky-blue);
            padding: 15px;
            border-radius: 12px;
            border-right: 6px solid var(--gold);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-dark);
            text-align: right;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-btn:hover {
            border-color: var(--gold);
            background: #fffdf5;
        }

        .option-btn .bullet {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            flex-shrink: 0;
        }

        .question-card.shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--accent-red);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .feedback-msg {
            font-weight: 800;
            font-size: 1.1rem;
            text-align: center;
            min-height: 25px;
        }

        .feedback-msg.correct { color: var(--accent-green); }
        .feedback-msg.wrong { color: var(--accent-red); }

        #win-screen {

            font-weight: 700;
            color: #555;
        }

            height: 22px;
            vertical-align: middle;
        }

</head>

                    "أحمد الله الذي وفقني، فلولا توفيق الله لي وعونه لما حفظت حرفاً واحداً، وأقول: (وما توفيقي إلا بالله، اللهم ثبتني)."
                ],
                correct: 2
            },
            {
                q: "ما هو الأثر الذي تشعر به حين تتعود على الاستعانة بالله في كل تفاصيل حياتك الصغيرة والكبيرة؟",
                options: [
                    "الشعور بالثقل وكثرة المسؤوليات.",
                    "الطمأنينة وراحة البال واليقين بأنك لست وحدك، فالله معك يحميك ويدبر أمرك."
                ],
                correct: 1
            }
        ];

        let studentName = "";
        let currentCloudIndex = 0;
        let attemptsCount = 0;
        let correctAnswersCount = 0;
        let startTime = null;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                osc.frequency.setValueAtTime(1046.50, now + 0.3);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.3);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50, 880, 1046.50];
                const times = [0, 0.15, 0.3, 0.45, 0.65, 0.85];
                const durations = [0.12, 0.12, 0.12, 0.18, 0.18, 0.4];

                notes.forEach((freq, idx) => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.type = 'sine';
                    noteOsc.frequency.setValueAtTime(freq, now + times[idx]);
                    
                    noteGain.gain.setValueAtTime(0.3, now + times[idx]);
                    noteGain.gain.exponentialRampToValueAtTime(0.01, now + times[idx] + durations[idx]);

                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);

                    noteOsc.start(now + times[idx]);
                    noteOsc.stop(now + times[idx] + durations[idx]);
                });
            }
        }

        function createBackgroundClouds() {
            const container = document.getElementById('bg-clouds-layer');
            container.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'bg-cloud';
                const width = 100 + Math.random() * 120;
                const height = width * 0.4;
                const top = Math.random() * 80;
                const duration = 20 + Math.random() * 25;
                const delay = Math.random() * -20;

                cloud.style.width = `${width}px`;
                cloud.style.height = `${height}px`;
                cloud.style.top = `${top}%`;
                cloud.style.animationDuration = `${duration}s`;
                cloud.style.animationDelay = `${delay}s`;
                container.appendChild(cloud);
            }
        }

        let cloudPositions = [];

        function generateCloudLayout() {
            const layer = document.getElementById('interactive-clouds-layer');
            layer.innerHTML = '';
            cloudPositions = [];

            const total = questionsData.length;
            const area = document.getElementById('game-area');
            const areaWidth = area.clientWidth || window.innerWidth;
            const areaHeight = area.clientHeight || (window.innerHeight - 75);

            const startY = areaHeight - 70; 
            const endY = 80; 
            const stepY = (startY - endY) / (total - 1);

            for (let i = 0; i < total; i++) {
                const y = startY - (i * stepY);
                let xPercent;
                if (i % 3 === 0) xPercent = 20 + (Math.random() * 12);
                else if (i % 3 === 1) xPercent = 50 + (Math.random() * 10 - 5);
                else xPercent = 80 - (Math.random() * 12);

                const x = (xPercent / 100) * (areaWidth - 100) + 50;

                cloudPositions.push({ x, y });

                const cloudEl = document.createElement('div');
                cloudEl.className = 'interactive-cloud';
                cloudEl.id = `cloud-${i}`;
                cloudEl.style.left = `${x - 45}px`;
                cloudEl.style.top = `${y - 28}px`;
                cloudEl.onclick = () => onCloudClick(i);

                cloudEl.innerHTML = `
                    <svg class="cloud-svg" viewBox="0 0 100 60">
                        <path d="M 20 45 C 10 45 0 35 0 25 C 0 15 10 10 20 10 C 25 0 45 0 55 10 C 65 0 85 5 90 20 C 100 20 100 35 90 45 Z" fill="#ffffff"/>
                    </svg>
                    <span class="cloud-number">${i + 1}</span>
                `;

                layer.appendChild(cloudEl);
            }

            moveBalloonTo(cloudPositions[0].x, cloudPositions[0].y + 35, false);
        }

        function moveBalloonTo(x, y, animate = true) {
            const balloon = document.getElementById('balloon');
            if (!animate) {
                balloon.style.transition = 'none';
            } else {
                balloon.style.transition = 'all 1.2s cubic-bezier(0.25, 1, 0.5, 1)';
            }
            balloon.style.left = `${x - 45}px`;
            balloon.style.top = `${y - 110}px`;
        }

        function startGame() {
            const input = document.getElementById('student-name-input');
            const name = input.value.trim();
            if (!name) {
                input.style.borderColor = 'var(--accent-red)';
                input.focus();
                return;
            }

            initAudio();
            studentName = name;
            document.getElementById('display-student-name').textContent = studentName;
            document.getElementById('header-student-badge').style.display = 'flex';
            document.getElementById('main-header').classList.add('compact');

            document.getElementById('start-screen').style.display = 'none';

            currentCloudIndex = 0;
            attemptsCount = 0;
            correctAnswersCount = 0;
            startTime = Date.now();

            generateCloudLayout();
        }

        function onCloudClick(index) {
            initAudio();
            if (index === currentCloudIndex) {
                openQuestionModal(index);
            }
        }

        function openQuestionModal(index) {
            const q = questionsData[index];
            document.getElementById('q-text').textContent = `${index + 1}. ${q.q}`;
            
            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = '';

            const feedback = document.getElementById('q-feedback');
            feedback.textContent = '';
            feedback.className = 'feedback-msg';

            document.getElementById('q-card').classList.remove('shake');

            q.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="bullet"></span><span>${optText}</span>`;
                btn.onclick = () => checkAnswer(optIdx, q.correct);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('question-modal').classList.add('active');
        }

        function checkAnswer(selectedIdx, correctIdx) {
            attemptsCount++;
            const feedback = document.getElementById('q-feedback');
            const qCard = document.getElementById('q-card');

            if (selectedIdx === correctIdx) {
                correctAnswersCount++;
                playSound('correct');
                feedback.textContent = "أحسنتِ! إجابة صحيحة 👏";
                feedback.className = "feedback-msg correct";

                document.getElementById(`cloud-${currentCloudIndex}`).classList.add('completed');

                setTimeout(() => {
                    document.getElementById('question-modal').classList.remove('active');
                    
                    const pos = cloudPositions[currentCloudIndex];
                    moveBalloonTo(pos.x, pos.y, true);

                    currentCloudIndex++;

                    if (currentCloudIndex >= questionsData.length) {
                        setTimeout(showWinScreen, 1500);
                    }
                }, 800);

            } else {
                playSound('wrong');
                feedback.textContent = "حاول مرة أخرى!";
                feedback.className = "feedback-msg wrong";

                qCard.classList.remove('shake');
                void qCard.offsetWidth;
                qCard.classList.add('shake');
            }
        }

        function showWinScreen() {
            playSound('win');
            const totalTime = Math.round((Date.now() - startTime) / 1000);

            document.getElementById('win-student-msg').textContent = `تهانينا يا ${studentName}! لقد أتممت الرحلة بنجاح واستعنت بالله حتى وصلت للقمة.`;
            document.getElementById('stat-correct').textContent = correctAnswersCount;
            document.getElementById('stat-attempts').textContent = attemptsCount;
            document.getElementById('stat-time').textContent = `${totalTime}ث`;

            document.getElementById('win-screen').classList.add('active');
        }

        function resetGame() {
            document.getElementById('win-screen').classList.remove('active');
            currentCloudIndex = 0;
            attemptsCount = 0;
            correctAnswersCount = 0;
            startTime = Date.now();

            generateCloudLayout();
        }

        window.addEventListener('resize', () => {
            if (document.getElementById('start-screen').style.display === 'none') {
                generateCloudLayout();
                const targetIdx = Math.min(currentCloudIndex, cloudPositions.length - 1);
                if (cloudPositions[targetIdx]) {
                    moveBalloonTo(cloudPositions[targetIdx].x, cloudPositions[targetIdx].y, false);
                }
            }
        });

        window.onload = function() {
            createBackgroundClouds();
        };
    </script>
</body>
</html>
